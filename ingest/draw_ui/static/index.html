<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Structure Redraw Tool</title>
<style>
  :root {
    --bg: #EDEFEA;
    --surface: #FAFBF8;
    --surface-raised: #FFFFFF;
    --ink: #1E2A26;
    --ink-soft: #445048;
    --muted: #7C8983;
    --border: #D9DDD4;
    --accent: #B0432A;
    --teal: #2F5D62;
    --code-bg: #F1F0E9;
    --valid-fg: #2F6B45;
    --valid-bg: #DEEBE1;
    --invalid-fg: #A3341F;
    --invalid-bg: #F3DCD6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .progress { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; margin-left: auto; }
  main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    padding: 20px 24px 40px;
    max-width: 1600px;
    margin: 0 auto;
    height: calc(100vh - 120px);
  }
  .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .panel {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .panel h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--teal);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .meta-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 3px 0; }
  .meta-row span:first-child { color: var(--muted); }
  .pill {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .pill-valid { background: var(--valid-bg); color: var(--valid-fg); }
  .pill-invalid { background: var(--invalid-bg); color: var(--invalid-fg); }
  code.smiles {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-all;
    max-height: 6em;
    overflow-y: auto;
  }
  .ref-image {
    background:
      linear-gradient(45deg, var(--code-bg) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg, var(--code-bg) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, transparent 75%, var(--code-bg) 75%) 0 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, var(--code-bg) 75%) 0 0/16px 16px,
      var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ref-image img { max-width: 100%; max-height: 260px; object-fit: contain; }
  .toolbar { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--ink);
    cursor: pointer;
    flex: 1;
  }
  button:hover { border-color: var(--teal); }
  button.primary { background: var(--teal); color: white; border-color: var(--teal); }
  button.primary:hover { background: #264c50; }
  .editor-panel {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .editor-panel iframe { flex: 1; border: none; width: 100%; }
  .status-line { font-size: 0.78rem; padding: 6px 12px; color: var(--muted); }
  .status-line.error { color: var(--invalid-fg); }
  .status-line.ok { color: var(--valid-fg); }
  .done-banner { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.05rem; grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <h1>Structure Redraw Tool</h1>
  <div class="progress" id="progress">loading…</div>
</header>

<main id="app">
  <p style="grid-column: 1 / -1; color: var(--muted);">Loading queue…</p>
</main>

<script>
const state = { items: [], idx: 0 };

async function loadQueue() {
  const res = await fetch("/api/queue");
  const data = await res.json();
  state.items = data.items;
  state.idx = 0;
  render();
}

function currentItem() {
  return state.items[state.idx];
}

function updateProgress() {
  document.getElementById("progress").textContent =
    state.items.length ? `${state.idx + 1} of ${state.items.length} remaining` : "";
}

function render() {
  updateProgress();
  const app = document.getElementById("app");
  if (!state.items.length) {
    app.innerHTML = `<div class="done-banner">Queue is empty — nothing left to review.</div>`;
    return;
  }
  const item = currentItem();

  app.innerHTML = `
    <div class="side">
      <div class="panel">
        <h2>Segment</h2>
        <div class="meta-row"><span>Paper</span><span>${item.paper}</span></div>
        <div class="meta-row"><span>File</span><span>${item.segment_path.split("/").pop()}</span></div>
        <div class="meta-row"><span>Valid</span><span class="pill ${item.rdkit_valid ? "pill-valid" : "pill-invalid"}">${item.rdkit_valid ? "valid" : "invalid"}</span></div>
        <div class="meta-row"><span>Wildcard</span><span>${item.has_wildcard ? "yes" : "no"}</span></div>
        <div class="meta-row"><span>Confidence</span><span>${item.mean_confidence.toFixed(3)}</span></div>
      </div>
      <div class="panel">
        <h2>Model's current (wrong) SMILES</h2>
        <code class="smiles">${item.smiles.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</code>
      </div>
      <div class="panel">
        <h2>Reference crop</h2>
        <div class="ref-image"><img src="/api/image/${item.paper}/${item.segment_path}" alt="reference"></div>
      </div>
      <div class="toolbar">
        <button id="skip">Skip</button>
        <button id="save" class="primary">Save drawing</button>
      </div>
      <div class="status-line" id="status"></div>
    </div>
    <div class="editor-panel">
      <iframe id="ketcherFrame" src="/vendor/ketcher/index.html"></iframe>
    </div>
  `;

  document.getElementById("skip").onclick = skipCurrent;
  document.getElementById("save").onclick = saveDrawing;
}

function getKetcherWindow() {
  const frame = document.getElementById("ketcherFrame");
  return frame && frame.contentWindow;
}

function waitForKetcher(timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    (function poll() {
      const w = getKetcherWindow();
      if (w && w.ketcher) return resolve(w.ketcher);
      if (Date.now() - start > timeoutMs) return reject(new Error("Ketcher editor didn't finish loading"));
      setTimeout(poll, 150);
    })();
  });
}

function setStatus(text, kind) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = text;
  el.className = "status-line" + (kind ? " " + kind : "");
}

async function skipCurrent() {
  const item = currentItem();
  await fetch("/api/skip", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paper: item.paper, segment_path: item.segment_path }),
  });
  await loadQueue();
}

async function saveDrawing() {
  const item = currentItem();
  setStatus("Reading structure from editor…");
  let ketcher;
  try {
    ketcher = await waitForKetcher();
  } catch (e) {
    setStatus("Editor isn't ready yet — wait a moment and try again.", "error");
    return;
  }

  let molfile;
  try {
    molfile = await ketcher.getMolfile();
  } catch (e) {
    setStatus("Couldn't read the drawing: " + e.message, "error");
    return;
  }

  const res = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paper: item.paper, segment_path: item.segment_path, molfile }),
  });
  const data = await res.json();
  if (!res.ok) {
    setStatus("Save failed: " + (data.detail || "unknown error"), "error");
    return;
  }
  setStatus(`Saved${data.valid ? "" : " (warning: RDKit still flags this as invalid)"}`, data.valid ? "ok" : "error");
  await loadQueue();
}

loadQueue();
</script>
</body>
</html>
